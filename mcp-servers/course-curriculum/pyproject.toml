[project]
name = "course-curriculum"
version = "0.1.0"
description = "MCP server exposing the Solo Operator's Manual curriculum and student state"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
course-curriculum = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
