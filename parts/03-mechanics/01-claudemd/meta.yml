chapter:
  number: 19
  part: 3
  slug: claudemd
  title: "CLAUDE.md"

learning_objective: >
  The student can write their own CLAUDE.md for the MembershipKit
  project, place it at the right path so Claude Code reads it at
  session start, and verify that Claude is following the rules they
  wrote.

prerequisites:
  chapters_completed:
    - 18
  concepts_required:
    - spec-as-authority
    - five-rank-authority-hierarchy
    - operator-as-manager

concepts_taught:
  - what-is-claudemd
  - project-level-vs-per-directory-vs-user-global
  - claudemd-anatomy
  - standing-rules-section
  - forbidden-section
  - link-feedback-corpus-from-claudemd
  - claudemd-is-author-not-generated

complexity: medium

recall_chapters:
  - 22   # hooks — when CLAUDE.md rules need mechanical backing
  - 32   # hero-level — mature CLAUDE.md walkthrough

drill:
  artifact: parts/03-mechanics/01-claudemd/verify.sh
  produces:
    - student/CLAUDE.md
    - student/drills/19-claudemd/01-claude-summary.txt
    - student/drills/19-claudemd/02-promoted-rule.txt
