name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: site
        run: pnpm check

      - name: Lint
        working-directory: site
        run: pnpm lint

      - name: Format check
        working-directory: site
        run: pnpm format:check

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        working-directory: site
        run: pnpm test

      - name: Serve built site (background)
        working-directory: site
        run: |
          nohup pnpm exec serve dist -l 4321 --no-clipboard --no-request-logging > serve.log 2>&1 &
          echo $! > serve.pid
          for i in {1..40}; do
            if curl -sf http://localhost:4321/ -o /dev/null; then
              echo "serve ready after ${i} attempt(s)"; break
            fi
            sleep 0.5
          done

      - name: Accessibility (pa11y)
        working-directory: site
        run: pnpm a11y

      - name: Lighthouse CI
        working-directory: site
        run: pnpm lhci

      - name: Stop background serve
        if: always()
        working-directory: site
        run: if [ -f serve.pid ]; then kill "$(cat serve.pid)" || true; fi
