chapter:
  number: 19
  part: 3
  slug: claudemd
  title: "AGENTS.md and CLAUDE.md"

learning_objective: >
  The student can write a portable AGENTS.md for MembershipKit, layer
  a Claude-specific CLAUDE.md on top, and verify that the active agent
  is following the rules they wrote.

prerequisites:
  chapters_completed:
    - 18
  concepts_required:
    - spec-as-authority
    - four-rank-authority-hierarchy
    - operator-as-manager

concepts_taught:
  - what-is-agentsmd
  - what-is-claudemd
  - agentsmd-portable-base-claudemd-overlay
  - project-level-vs-per-directory-vs-user-global
  - claudemd-anatomy
  - standing-rules-section
  - forbidden-section
  - link-feedback-corpus-from-claudemd
  - claudemd-is-author-not-generated

complexity: medium

recall_chapters:
  - 21   # hooks — when CLAUDE.md rules need mechanical backing
  - 32   # hero-level — mature CLAUDE.md walkthrough

drill:
  artifact: parts/03-mechanics/01-claudemd/verify.sh
  produces:
    - student/AGENTS.md
    - student/CLAUDE.md
    - student/drills/19-claudemd/01-claude-summary.txt
    - student/drills/19-claudemd/02-promoted-rule.txt
