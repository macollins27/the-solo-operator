  - mature-claudemd-anatomy
  - incident-authored-rules-with-dates
  - density-not-length
  - link-not-inline-subdocs
  - growth-pattern-60-day-arc

complexity: high

recall_chapters:
  - 38   # operator-journey-over-time

drill:
